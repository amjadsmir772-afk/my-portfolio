<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>حاسبة الطلب | EasyShop</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="topbar">
        <div class="container"><span>متجر EasyShop الإلكتروني</span><span class="clock" id="clock"></span></div>
    </div>
    <header class="navbar">
        <div class="container nav-inner"><a class="logo" href="index.html">Easy<span>Shop</span></a><button
                class="icon-btn menu-btn" id="menuBtn">☰</button>
            <nav>
                <ul class="nav-links" id="navLinks">
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="about.html">من نحن</a></li>
                    <li><a href="services.html">الخدمات</a></li>
                    <li><a href="products.html">المنتجات</a></li>
                    <li><a href="calculator.html">الحاسبة</a></li>
                    <li><a href="contact.html">اتصل بنا</a></li>
                    <li><a href="login.html">تسجيل الدخول</a></li>
                </ul>
            </nav>
            <div class="nav-actions"><button class="icon-btn" id="themeBtn" title="الوضع الليلي">🌙</button><a
                    class="icon-btn cart-link" href="cart.html">🛒<span class="badge" id="cartCount">0</span></a></div>
        </div>
    </header>
    <main>
        <section class="page-head">
            <div class="container">
                <h1>حاسبة سعر المنتجات</h1>
                <p>حساب قيمة المنتج حسب السعر والكمية والخصم.</p>
            </div>
        </section>
        <section class="section">
            <div class="container">
                <div class="form-card">
                    <div class="form-group"><label>سعر المنتج</label><input class="input" id="calcPrice" type="number"
                            min="0" placeholder="مثال: 899"></div>
                    <div class="form-group"><label>الكمية</label><input class="input" id="calcQty" type="number" min="1"
                            value="1"></div>
                    <div class="form-group"><label>الخصم %</label><input class="input" id="calcDiscount" type="number"
                            min="0" max="100" value="0"></div><button class="btn" id="calcBtn" type="button">احسب
                        الإجمالي</button>
                    <div id="calcResult" class="kv-box" style="margin-top:15px">أدخل البيانات ثم اضغط احسب.</div>
                </div>
            </div>
        </section>
    </main>
    <footer class="footer">
        <div class="container footer-bottom">© 2026 EasyShop - مشروع مادة JavaScript</div>
    </footer>
    <div class="toast" id="toast"></div><button class="back-top" id="backTop">↑</button>
    <script src="js/script.js"></script>
</body>

</html>
